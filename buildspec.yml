# Buildspec for backend: builds NestJS, builds Docker image, and pushes to ECR
# Environment variables required (set these in CodeBuild project environment):
# - AWS_DEFAULT_REGION (required)
# - AWS_ACCOUNT_ID (required)
# - ECR_REPOSITORY (required)
# - IMAGE_TAG (optional; defaults to "latest" if not provided)
# - PUSH_LATEST (optional; set to "true" to also push the "latest" tag)
# - DOCKER_BUILD_ARGS (optional; extra arguments for `docker build`, e.g., "--build-arg FOO=bar")
version: 0.2

# Request Node.js 18 in the build image
runtime-versions:
  nodejs: 18

cache:
  paths:
    # Cache npm cache to speed up installs between builds
    - '/root/.npm/**/*'

phases:
  install:
    commands:
      - echo Installing backend dependencies...
      - cd beca-be && npm ci
  pre_build:
    commands:
      - echo Building the backend (TypeScript)...
      - cd beca-be && npm run build
      - echo Ensuring ECR repository exists (if permissions allow)...
      - |
        aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_DEFAULT_REGION" 2>/dev/null || \
        aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_DEFAULT_REGION"
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - export IMAGE_TAG=${IMAGE_TAG:-latest}
      - export IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"
  build:
    commands:
      - echo Building Docker image from beca-be/Dockerfile...
      - docker build -t "$IMAGE_URI" ${DOCKER_BUILD_ARGS:-} "$CODEBUILD_SRC_DIR/beca-be"
  post_build:
    commands:
      - echo Pushing Docker image $IMAGE_URI ...
      - docker push "$IMAGE_URI"
      - |
        if [ "${PUSH_LATEST:-}" = "true" ]; then
          LATEST_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY:latest"
          echo "Tagging and pushing additional tag: $LATEST_URI"
          docker tag "$IMAGE_URI" "$LATEST_URI"
          docker push "$LATEST_URI"
        else
          echo "PUSH_LATEST not set to 'true' - skipping latest tag push"
        fi
      - echo Build completed on `date`
      - |
        # Optionally package compiled dist/ as backend.zip so teams can use the artifact
        if [ -d "beca-be/dist" ]; then
          echo "Packaging beca-be/dist into backend.zip"
          (cd beca-be/dist && zip -r "$CODEBUILD_SRC_DIR/backend.zip" .)
        else
          echo "No beca-be/dist directory found; skipping artifact packaging"
        fi

artifacts:
  # We upload backend.zip if it was created above. If you prefer to upload dist/ directly,
  # change these settings or produce a different artifact in post_build.
  files:
    - backend.zip
  discard-paths: yes